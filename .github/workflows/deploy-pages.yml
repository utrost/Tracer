name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    env:
      # actions/deploy-pages@v5 currently emits Node's internal punycode
      # deprecation from its dependency tree. Keep the workflow log clean while
      # staying on the latest Pages action.
      NODE_OPTIONS: --no-deprecation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare pages content
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp manifest.webmanifest _site/
          cp sw.js _site/
          cp -R icons _site/
          cp -R docs _site/
          cp ROADMAP.md _site/
          test -f _site/docs/samples/reference-grid.svg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
